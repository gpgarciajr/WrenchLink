<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | WrenchLink</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        🔧 WrenchLink
    </div>

    <a href="index.html" class="btn btn-small">
        Back to WrenchLink
    </a>

</header>


<main>

<section class="services">

    <div class="section-heading">

        <p class="eyebrow">
            WRENCHLINK
        </p>

        <h1>
            Create Your Account
        </h1>

        <p>
            Join WrenchLink and connect with mobile mechanics.
        </p>

    </div>


    <div class="service-card">

        <form id="signupForm">

            <label for="name">
                Full Name
            </label>

            <input
                id="name"
                type="text"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                id="phone"
                type="tel"
                placeholder="Enter your phone number"
                required
            >


            <label for="accountType">
                I am a...
            </label>

            <select id="accountType" required>

                <option value="">
                    Select account type
                </option>

                <option value="customer">
                    Customer
                </option>

                <option value="mechanic">
                    Mobile Mechanic
                </option>

            </select>


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Create a password"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm your password"
                required
            >


            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Account
            </button>

        </form>


        <p style="margin-top: 20px;">
            Already have an account?
        </p>

        <a
            href="login.html"
            class="btn"
        >
            Sign In
        </a>

    </div>

</section>

</main>


<footer class="footer">

    <div>

        <strong>🔧 WrenchLink</strong>

        <p>
            Connecting drivers with mobile mechanics.
        </p>

    </div>


    <div class="footer-links">

        <a href="privacy.html">
            Privacy
        </a>

        <a href="terms.html">
            Terms
        </a>

        <a href="contact.html">
            Contact
        </a>

    </div>

</footer>


<script>

document.getElementById("signupForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;
    }

    alert("Account setup received. We will connect this to real account authentication next.");

});

</script>

</body>

</html>
