<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mechanic Profile | WrenchLink</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            🔧 WrenchLink
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="mechanics.html">
                Find a Mechanic
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="about.html">
                About
            </a>

            <a
                href="login.html"
                class="btn btn-small"
            >
                Sign In
            </a>

        </nav>

    </div>

</header>

<main class="container">

    <div id="profileContainer"></div>

</main>

<footer class="site-footer">

    <div class="container">

        <p>
            © 2026 WrenchLink. All rights reserved.
        </p>

        <div>

            <a href="privacy.html">
                Privacy
            </a>

            <a href="terms.html">
                Terms
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>

    </div>

</footer>

<script>

const demoMechanics = [

    {
        id: "mechanic-1",
        name: "Mike's Mobile Auto",
        city: "Chicago",
        state: "IL",
        zip: "60618",
        radius: 25,
        services: [
            "Brakes & Rotors",
            "Battery",
            "Alternator",
            "Starter",
            "Diagnostics"
        ],
        experience: 12,
        rating: 4.9,
        reviews: 47,
        available: true,
        distance: 3.2,
        about:
            "Experienced mobile mechanic providing dependable repairs at your location."
    },

    {
        id: "mechanic-2",
        name: "Southside Mobile Mechanics",
        city: "Chicago",
        state: "IL",
        zip: "60620",
        radius: 20,
        services: [
            "Battery",
            "Alternator",
            "Starter",
            "Oil Change",
            "Diagnostics"
        ],
        experience: 8,
        rating: 4.8,
        reviews: 31,
        available: true,
        distance: 7.6,
        about:
            "Mobile repair service focused on diagnostics and common mechanical repairs."
    },

    {
        id: "mechanic-3",
        name: "Chicago Roadside Pro",
        city: "Chicago",
        state: "IL",
        zip: "60632",
        radius: 30,
        services: [
            "Roadside Assistance",
            "Battery",
            "Tire Assistance",
            "Lockout",
            "Fuel Delivery"
        ],
        experience: 10,
        rating: 4.7,
        reviews: 28,
        available: false,
        distance: 10.4,
        about:
            "Roadside and mobile assistance throughout the Chicago area."
    },

    {
        id: "mechanic-4",
        name: "Garcia Mobile Repair",
        city: "Chicago",
        state: "IL",
        zip: "60629",
        radius: 25,
        services: [
            "Brakes & Rotors",
            "Battery",
            "Alternator",
            "Starter",
            "Diagnostics",
            "Oil Change",
            "Tire Assistance",
            "Other Repairs"
        ],
        experience: 10,
        rating: 5.0,
        reviews: 19,
        available: true,
        distance: 5.1,
        about:
            "Professional mobile repair service focused on convenient repairs at the customer's location."
    }

];

function getMechanics() {

    const savedProfile =
        JSON.parse(
            localStorage.getItem(
                "wrenchlinkMechanicProfile"
            )
        ) || null;

    const savedArea =
        JSON.parse(
            localStorage.getItem(
                "wrenchlinkServiceArea"
            )
        ) || null;

    if (
        savedProfile &&
        savedProfile.name
    ) {

        const services =
            savedProfile.services
                ? savedProfile.services
                    .split(",")
                    .map(function(service) {
                        return service.trim();
                    })
                    .filter(Boolean)
                : [];

        return [

            {
                id: "local-mechanic",

                name: savedProfile.name,

                city:
                    savedArea?.city ||
                    "Chicago",

                state:
                    savedArea?.state ||
                    "IL",

                zip:
                    savedArea?.zip ||
                    "",

                radius:
                    Number(savedArea?.radius) ||
                    25,

                services:
                    services.length
                        ? services
                        : ["Diagnostics"],

                experience:
                    Number(savedProfile.experience) ||
                    0,

                rating: 5.0,

                reviews: 0,

                available: true,

                distance: 0,

                about:
                    savedProfile.about ||
                    "WrenchLink mobile mechanic."

            },

            ...demoMechanics

        ];

    }

    return demoMechanics;

}

function renderProfile() {

    const container =
        document.getElementById(
            "profileContainer"
        );

    const params =
        new URLSearchParams(
            window.location.search
        );

    const mechanicId =
        params.get("id");

    const mechanics =
        getMechanics();

    const mechanic =
        mechanics.find(function(item) {
            return item.id === mechanicId;
        });

    if (!mechanic) {

        container.innerHTML = `

            <section class="card">

                <h1>Mechanic Not Found</h1>

                <p>
                    We couldn't find this mechanic.
                </p>

                <a
                    href="mechanics.html"
                    class="btn"
                >
                    Back to Mechanics
                </a>

            </section>

        `;

        return;

    }

    const stars =
        "★".repeat(
            Math.round(mechanic.rating)
        );

    const services =
        mechanic.services
            .map(function(service) {

                return `
                    <span class="service-tag">
                        ${escapeHTML(service)}
                    </span>
                `;

            })
            .join("");

    const availability =
        mechanic.available
            ? "Available Now"
            : "Currently Unavailable";

    container.innerHTML = `

        <section class="page-hero">

            <p class="eyebrow">
                MECHANIC PROFILE
            </p>

            <h1>
                ${escapeHTML(mechanic.name)}
            </h1>

            <p>
                ${escapeHTML(mechanic.city)},
                ${escapeHTML(mechanic.state)}
            </p>

        </section>

        <section class="card">

            <div class="mechanic-profile-header">

                <div class="mechanic-avatar">
                    🔧
                </div>

                <div>

                    <h2>
                        ${escapeHTML(mechanic.name)}
                    </h2>

                    <p class="rating">

                        ${stars}

                        <strong>
                            ${mechanic.rating.toFixed(1)}
                        </strong>

                        <span>
                            (${mechanic.reviews} reviews)
                        </span>

                    </p>

                    <p>
                        ● ${availability}
                    </p>

                </div>

            </div>

            <hr>

            <h3>About This Mechanic</h3>

            <p>
                ${escapeHTML(mechanic.about)}
            </p>

            <h3>
                Experience
            </h3>

            <p>
                ${mechanic.experience}
                years of experience
            </p>

            <h3>
                Service Area
            </h3>

            <p>
                ${escapeHTML(mechanic.city)},
                ${escapeHTML(mechanic.state)}
                and surrounding areas within
                ${mechanic.radius} miles.
            </p>

            <h3>
                Services
            </h3>

            <div class="service-tags">
                ${services}
            </div>

            <div class="button-row">

                <a
                    href="post-job.html?mechanic=${encodeURIComponent(mechanic.id)}"
                    class="btn"
                >
                    Request This Mechanic
                </a>

                <a
                    href="mechanics.html"
                    class="btn btn-secondary"
                >
                    Back to Search
                </a>

            </div>

        </section>

        <section class="card">

            <h2>
                Reviews
            </h2>

            <div id="reviews"></div>

        </section>

    `;

    renderReviews(mechanic);

}

function renderReviews(mechanic) {

    const reviewsContainer =
        document.getElementById(
            "reviews"
        );

    const savedReviews =
        JSON.parse(
            localStorage.getItem(
                "wrenchlinkReviews"
            )
        ) || [];

    const reviews =
        savedReviews.filter(function(review) {

            return review.mechanicId === mechanic.id;

        });

    if (!reviews.length) {

        reviewsContainer.innerHTML = `

            <p>
                No customer reviews have been posted
                for this mechanic yet.
            </p>

        `;

        return;

    }

    reviewsContainer.innerHTML =
        reviews
            .map(function(review) {

                const stars =
                    "★".repeat(
                        Number(review.rating) || 0
                    );

                return `

                    <div class="review-item">

                        <p class="rating">
                            ${stars}
                        </p>

                        <p>
                            ${escapeHTML(
                                review.comment ||
                                "Customer review."
                            )}
                        </p>

                    </div>

                `;

            })
            .join("");

}

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

document.addEventListener(
    "DOMContentLoaded",
    renderProfile
);

</script>

</body>
</html>
