<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Service Area | WrenchLink</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="container">

        <h1>
            <a href="index.html">🔧 WrenchLink</a>
        </h1>

        <nav>
            <a href="mechanic-dashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
        </nav>

    </div>

</header>


<main class="container">

    <section class="page-header">

        <h2>My Service Area</h2>

        <p>
            Tell customers where you provide mobile mechanic service.
        </p>

    </section>


    <section class="card">

        <form id="serviceAreaForm">

            <label for="city">
                City
            </label>

            <input
                id="city"
                type="text"
                placeholder="Example: Chicago"
                required
            >


            <label for="state">
                State
            </label>

            <input
                id="state"
                type="text"
                value="IL"
                required
            >


            <label for="zip">
                ZIP Code
            </label>

            <input
                id="zip"
                type="text"
                placeholder="Example: 60601"
                required
            >


            <label for="radius">
                Service Radius
            </label>

            <select id="radius" required>

                <option value="5">
                    5 miles
                </option>

                <option value="10">
                    10 miles
                </option>

                <option value="15">
                    15 miles
                </option>

                <option value="20">
                    20 miles
                </option>

                <option value="25">
                    25 miles
                </option>

                <option value="30">
                    30 miles
                </option>

                <option value="50">
                    50 miles
                </option>

            </select>


            <button type="submit">
                Save Service Area
            </button>

        </form>


        <div
            id="savedMessage"
            style="display:none;"
        >

            <h3>Service Area Saved ✓</h3>

            <p id="savedAreaText"></p>

            <a href="mechanic-dashboard.html">
                Return to Dashboard
            </a>

        </div>

    </section>

</main>


<footer>

    <div class="container">

        <p>
            © 2026 WrenchLink. All rights reserved.
        </p>

        <p>
            <a href="privacy.html">Privacy</a> |
            <a href="terms.html">Terms</a> |
            <a href="contact.html">Contact</a>
        </p>

    </div>

</footer>


<script>

const areaKey =
    "wrenchlinkServiceArea";


function loadArea() {

    const saved =
        localStorage.getItem(areaKey);

    if (!saved) return;

    const area =
        JSON.parse(saved);

    document.getElementById("city").value =
        area.city || "";

    document.getElementById("state").value =
        area.state || "IL";

    document.getElementById("zip").value =
        area.zip || "";

    document.getElementById("radius").value =
        area.radius || "10";
}


document.getElementById(
    "serviceAreaForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const area = {

            city:
                document.getElementById("city").value.trim(),

            state:
                document.getElementById("state").value.trim(),

            zip:
                document.getElementById("zip").value.trim(),

            radius:
                document.getElementById("radius").value

        };


        localStorage.setItem(
            areaKey,
            JSON.stringify(area)
        );


        document.getElementById(
            "savedAreaText"
        ).textContent =
            area.city +
            ", " +
            area.state +
            " " +
            area.zip +
            " — " +
            area.radius +
            " mile service radius.";


        document.getElementById(
            "savedMessage"
        ).style.display = "block";


        document.getElementById(
            "savedMessage"
        ).scrollIntoView({
            behavior: "smooth"
        });

    }
);


document.addEventListener(
    "DOMContentLoaded",
    loadArea
);

</script>

</body>
</html>
