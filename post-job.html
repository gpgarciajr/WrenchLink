<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job | WrenchLink</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="container">
        <h1><a href="index.html">🔧 WrenchLink</a></h1>

        <nav>
            <a href="customer-dashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="page-header">
        <h2>Post a Job</h2>
        <p>Tell mechanics what service you need.</p>
    </section>

    <section class="card">

        <form id="jobForm">

            <label for="vehicle">Vehicle</label>
            <input
                id="vehicle"
                type="text"
                placeholder="Example: 2019 Kia Soul 1.6L"
                required
            >

            <label for="service">Service Needed</label>

            <select id="service" required>
                <option value="">Select a service</option>
                <option>Brakes & Rotors</option>
                <option>Battery</option>
                <option>Alternator</option>
                <option>Starter</option>
                <option>Diagnostics</option>
                <option>Oil Change</option>
                <option>Roadside Assistance</option>
                <option>Tire Assistance</option>
                <option>Other</option>
            </select>

            <label for="description">Describe the Problem</label>

            <textarea
                id="description"
                rows="5"
                placeholder="Describe what's happening..."
                required
            ></textarea>

            <label for="city">Service City</label>
            <input id="city" type="text" required>

            <label for="state">State</label>
            <input id="state" type="text" value="IL" required>

            <label for="zip">ZIP Code</label>
            <input id="zip" type="text" required>

            <label for="location">
                Service Address
            </label>

            <input
                id="location"
                type="text"
                placeholder="Street address"
                required
            >

            <label for="dateTime">
                Preferred Date & Time
            </label>

            <input id="dateTime" type="datetime-local">

            <button type="submit">
                Post Job
            </button>

        </form>

        <div id="successMessage" style="display:none;">

            <h3>Job Posted ✓</h3>

            <p>
                Your service request has been saved.
            </p>

            <a href="customer-dashboard.html">
                Return to Dashboard
            </a>

        </div>

    </section>

</main>

<footer>

    <div class="container">

        <p>© 2026 WrenchLink. All rights reserved.</p>

        <p>
            <a href="privacy.html">Privacy</a> |
            <a href="terms.html">Terms</a> |
            <a href="contact.html">Contact</a>
        </p>

    </div>

</footer>

<script>

const jobsKey = "wrenchlinkJobs";

document.getElementById("jobForm").addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const savedProfile =
            localStorage.getItem("wrenchlinkCustomerProfile");

        const profile =
            savedProfile
                ? JSON.parse(savedProfile)
                : {};

        const savedJobs =
            localStorage.getItem(jobsKey);

        const jobs =
            savedJobs
                ? JSON.parse(savedJobs)
                : [];

        const newJob = {

            id: Date.now(),

            customerName:
                profile.name || "Customer",

            customerEmail:
                profile.email || "",

            customerPhone:
                profile.phone || "",

            vehicle:
                document.getElementById("vehicle").value.trim(),

            service:
                document.getElementById("service").value,

            description:
                document.getElementById("description").value.trim(),

            city:
                document.getElementById("city").value.trim(),

            state:
                document.getElementById("state").value.trim(),

            zip:
                document.getElementById("zip").value.trim(),

            location:
                document.getElementById("location").value.trim(),

            preferredDateTime:
                document.getElementById("dateTime").value,

            status: "Open",

            mechanicId: null,

            mechanicName: null,

            createdAt:
                new Date().toISOString()

        };

        jobs.unshift(newJob);

        localStorage.setItem(
            jobsKey,
            JSON.stringify(jobs)
        );

        document.getElementById("jobForm").style.display =
            "none";

        document.getElementById("successMessage").style.display =
            "block";

    }
);

</script>

</body>
</html>
