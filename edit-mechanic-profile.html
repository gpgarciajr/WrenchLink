<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Mechanic Profile | WrenchLink</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="container">
        <a href="mechanic-dashboard.html" class="logo">🔧 WrenchLink</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="mechanics.html">Find a Mechanic</a>
            <a href="services.html">Services</a>
            <a href="mechanic-dashboard.html">Dashboard</a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="page-header">
        <h1>Edit Mechanic Profile</h1>
        <p>Keep your mechanic profile accurate so customers know who they are hiring.</p>
    </section>

    <section class="form-section">

        <form id="mechanicProfileForm">

            <h2>Basic Information</h2>

            <label for="name">Full Name</label>
            <input id="name" type="text" required>

            <label for="email">Email</label>
            <input id="email" type="email" required>

            <label for="phone">Phone</label>
            <input id="phone" type="tel" required>

            <label for="experience">Years of Experience</label>
            <input id="experience" type="number" min="0" max="100" required>

            <label class="checkbox-row">
                <input id="available" type="checkbox">
                <span>Available for new jobs</span>
            </label>

            <h2>Services</h2>

            <p>Select the services you provide.</p>

            <div class="checkbox-grid">

                <label class="checkbox-row">
                    <input type="checkbox" name="service" value="Oil Change">
                    <span>Oil Change</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" name="service" value="Brake Repair">
                    <span>Brake Repair</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" name="service" value="Battery">
                    <span>Battery</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" name="service" value="Alternator">
                    <span>Alternator</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" name="service" value="Starter">
                    <span>Starter</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" name="service" value="Diagnostics">
                    <span>Diagnostics</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" name="service" value="Tire Service">
                    <span>Tire Service</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" name="service" value="Suspension">
                    <span>Suspension</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" name="service" value="AC Repair">
                    <span>AC Repair</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" name="service" value="Roadside Assistance">
                    <span>Roadside Assistance</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" name="service" value="General Repair">
                    <span>General Repair</span>
                </label>

            </div>

            <label for="about">About You</label>
            <textarea
                id="about"
                rows="6"
                placeholder="Tell customers about your experience, specialties, and what makes your service different."
            ></textarea>

            <div id="message"></div>

            <button type="submit" class="btn">
                Save Profile
            </button>

            <button
                type="button"
                class="btn btn-secondary"
                onclick="window.location.href='mechanic-dashboard.html'"
            >
                Cancel
            </button>

        </form>

    </section>

</main>

<script src="app.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const currentUser = getCurrentUser();

    if (!currentUser) {
        window.location.href = "login.html";
        return;
    }

    if (currentUser.role === "admin") {
        window.location.href = "admin/index.html";
        return;
    }

    if (currentUser.role !== "mechanic") {
        window.location.href = "customer-dashboard.html";
        return;
    }

    const users = WrenchLinkStorage.get("wrenchlinkUsers", []);
    const profiles = WrenchLinkStorage.get("wrenchlinkMechanicProfiles", {});

    const storedUser = users.find(function (user) {
        return user.id === currentUser.id;
    });

    const profile = profiles[currentUser.id] || {};

    document.getElementById("name").value =
        profile.name ||
        storedUser?.name ||
        currentUser.name ||
        "";

    document.getElementById("email").value =
        profile.email ||
        storedUser?.email ||
        currentUser.email ||
        "";

    document.getElementById("phone").value =
        profile.phone ||
        storedUser?.phone ||
        currentUser.phone ||
        "";

    document.getElementById("experience").value =
        profile.experience ?? 0;

    document.getElementById("about").value =
        profile.about || "";

    document.getElementById("available").checked =
        profile.available !== undefined
            ? Boolean(profile.available)
            : storedUser?.available !== undefined
                ? Boolean(storedUser.available)
                : true;

    let existingServices = profile.services || [];

    if (typeof existingServices === "string") {
        existingServices = existingServices
            .split(",")
            .map(function (service) {
                return service.trim();
            })
            .filter(Boolean);
    }

    document.querySelectorAll('input[name="service"]').forEach(function (checkbox) {
        checkbox.checked = existingServices.includes(checkbox.value);
    });

    document.getElementById("mechanicProfileForm").addEventListener("submit", function (event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const phone = document.getElementById("phone").value.trim();
        const experience = Number(document.getElementById("experience").value);
        const available = document.getElementById("available").checked;
        const about = document.getElementById("about").value.trim();

        const services = Array.from(
            document.querySelectorAll('input[name="service"]:checked')
        ).map(function (checkbox) {
            return checkbox.value;
        });

        const message = document.getElementById("message");

        if (!name || !email || !phone) {
            message.textContent = "Please complete all required fields.";
            return;
        }

        if (!email.includes("@")) {
            message.textContent = "Please enter a valid email address.";
            return;
        }

        if (!Number.isFinite(experience) || experience < 0) {
            message.textContent = "Please enter a valid number of years.";
            return;
        }

        if (services.length === 0) {
            message.textContent = "Select at least one service.";
            return;
        }

        const duplicateEmail = users.some(function (user) {
            return user.id !== currentUser.id &&
                   user.email &&
                   user.email.toLowerCase() === email;
        });

        if (duplicateEmail) {
            message.textContent = "That email address is already being used.";
            return;
        }

        const updatedProfile = {
            id: currentUser.id,
            userId: currentUser.id,
            name: name,
            email: email,
            phone: phone,
            experience: experience,
            available: available,
            services: services,
            about: about,
            updatedAt: new Date().toISOString()
        };

        profiles[currentUser.id] = updatedProfile;

        WrenchLinkStorage.set(
            "wrenchlinkMechanicProfiles",
            profiles
        );

        const userIndex = users.findIndex(function (user) {
            return user.id === currentUser.id;
        });

        if (userIndex !== -1) {

            users[userIndex] = {
                ...users[userIndex],
                name: name,
                firstName: name.split(" ")[0],
                lastName: name.split(" ").slice(1).join(" "),
                email: email,
                phone: phone,
                role: "mechanic",
                mechanicId: currentUser.id,
                available: available
            };

            WrenchLinkStorage.set("wrenchlinkUsers", users);
        }

        setCurrentUser({
            ...currentUser,
            name: name,
            firstName: name.split(" ")[0],
            lastName: name.split(" ").slice(1).join(" "),
            email: email,
            phone: phone,
            role: "mechanic",
            mechanicId: currentUser.id,
            available: available
        });

        message.textContent = "Profile saved successfully.";

        setTimeout(function () {
            window.location.href = "mechanic-dashboard.html";
        }, 700);
    });
});
</script>

</body>
</html>
```
