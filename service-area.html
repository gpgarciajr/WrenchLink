<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Area | WrenchLink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container">
        <a href="mechanic-dashboard.html" class="logo">🔧 WrenchLink</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="mechanics.html">Find a Mechanic</a>
            <a href="mechanic-dashboard.html">Dashboard</a>
        </nav>
    </div>
</header>

<main class="container">
    <section class="page-header">
        <h1>My Service Area</h1>
        <p>Tell customers where you provide mobile mechanic services.</p>
    </section>

    <section class="form-section">
        <form id="serviceAreaForm">
            <label for="city">City</label>
            <input id="city" type="text" required>

            <label for="state">State</label>
            <input id="state" type="text" maxlength="2"
                   placeholder="IL" required>

            <label for="zip">ZIP Code</label>
            <input id="zip" type="text" maxlength="10"
                   placeholder="60601" required>

            <label for="radius">Service Radius (miles)</label>
            <input id="radius" type="number" min="1" max="250"
                   value="25" required>

            <p id="message" role="status"></p>

            <button type="submit" class="btn">Save Service Area</button>
            <a href="mechanic-dashboard.html" class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </section>
</main>

<script src="app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const user = getCurrentUser();

    if (!user) {
        location.href = "login.html";
        return;
    }

    if (user.role === "admin") {
        location.href = "admin/index.html";
        return;
    }

    if (user.role !== "mechanic") {
        location.href = "customer-dashboard.html";
        return;
    }

    const areas = WrenchLinkStorage.get("wrenchlinkServiceAreas", {});
    const legacyArea = WrenchLinkStorage.get("wrenchlinkServiceArea", null);

    const area = areas[user.id] ||
        (legacyArea && legacyArea.mechanicId === user.id ? legacyArea : {});

    document.getElementById("city").value = area.city || "";
    document.getElementById("state").value = area.state || "";
    document.getElementById("zip").value = area.zip || "";
    document.getElementById("radius").value = area.radius ?? 25;

    document.getElementById("serviceAreaForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const city = document.getElementById("city").value.trim();
        const state = document.getElementById("state").value.trim().toUpperCase();
        const zip = document.getElementById("zip").value.trim();
        const radius = Number(document.getElementById("radius").value);
        const message = document.getElementById("message");

        if (!city) {
            message.textContent = "Enter your city.";
            return;
        }

        if (!/^[A-Z]{2}$/.test(state)) {
            message.textContent = "Enter a valid two-letter state code.";
            return;
        }

        if (!/^\d{5}(-\d{4})?$/.test(zip)) {
            message.textContent = "Enter a valid ZIP code.";
            return;
        }

        if (!Number.isFinite(radius) || radius < 1 || radius > 250) {
            message.textContent = "Choose a service radius from 1 to 250 miles.";
            return;
        }

        const updatedArea = {
            mechanicId: user.id,
            city,
            state,
            zip,
            radius,
            updatedAt: new Date().toISOString()
        };

        areas[user.id] = updatedArea;

        WrenchLinkStorage.set("wrenchlinkServiceAreas", areas);
        WrenchLinkStorage.set("wrenchlinkServiceArea", updatedArea);

        message.textContent = "Service area saved successfully.";

        setTimeout(function () {
            location.href = "mechanic-dashboard.html";
        }, 700);
    });
});
</script>

</body>
</html>
