<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Mechanic Profile | WrenchLink</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="container">

        <h1>
            <a href="index.html">🔧 WrenchLink</a>
        </h1>

        <nav>
            <a href="mechanic-dashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
        </nav>

    </div>
</header>


<main class="container">

    <section class="page-header">

        <h2>Mechanic Profile</h2>

        <p>
            Build your profile so customers know who they are hiring.
        </p>

    </section>


    <section class="card">

        <form id="mechanicProfileForm">

            <label for="name">Full Name</label>

            <input
                id="name"
                type="text"
                placeholder="Your full name"
                required
            >


            <label for="email">Email</label>

            <input
                id="email"
                type="email"
                placeholder="Your email"
                required
            >


            <label for="phone">Phone</label>

            <input
                id="phone"
                type="tel"
                placeholder="Your phone number"
                required
            >


            <label for="experience">
                Years of Experience
            </label>

            <input
                id="experience"
                type="number"
                min="0"
                max="70"
                placeholder="Example: 10"
            >


            <label for="services">
                Services You Provide
            </label>

            <textarea
                id="services"
                rows="5"
                placeholder="Example: Brakes, diagnostics, alternators, starters, batteries..."
            ></textarea>


            <label for="about">
                About You
            </label>

            <textarea
                id="about"
                rows="6"
                placeholder="Tell customers about your experience and what makes your service different."
            ></textarea>


            <button type="submit">
                Save Profile
            </button>

        </form>


        <div
            id="successMessage"
            style="display:none;"
        >

            <h3>Profile Saved ✓</h3>

            <p>
                Your mechanic profile has been updated.
            </p>

            <a href="mechanic-dashboard.html">
                Return to Dashboard
            </a>

        </div>

    </section>

</main>


<footer>

    <div class="container">

        <p>
            © 2026 WrenchLink. All rights reserved.
        </p>

        <p>
            <a href="privacy.html">Privacy</a> |
            <a href="terms.html">Terms</a> |
            <a href="contact.html">Contact</a>
        </p>

    </div>

</footer>


<script>

const profileKey =
    "wrenchlinkMechanicProfile";


function loadProfile() {

    const saved =
        localStorage.getItem(profileKey);

    if (!saved) return;

    const profile =
        JSON.parse(saved);

    document.getElementById("name").value =
        profile.name || "";

    document.getElementById("email").value =
        profile.email || "";

    document.getElementById("phone").value =
        profile.phone || "";

    document.getElementById("experience").value =
        profile.experience || "";

    document.getElementById("services").value =
        profile.services || "";

    document.getElementById("about").value =
        profile.about || "";
}


document.getElementById(
    "mechanicProfileForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const existing =
            localStorage.getItem(profileKey);

        const oldProfile =
            existing
                ? JSON.parse(existing)
                : {};

        const profile = {

            name:
                document.getElementById("name").value.trim(),

            email:
                document.getElementById("email").value.trim(),

            phone:
                document.getElementById("phone").value.trim(),

            serviceArea:
                oldProfile.serviceArea || "",

            experience:
                document.getElementById("experience").value.trim(),

            services:
                document.getElementById("services").value.trim(),

            about:
                document.getElementById("about").value.trim()

        };


        localStorage.setItem(
            profileKey,
            JSON.stringify(profile)
        );


        document.getElementById(
            "successMessage"
        ).style.display = "block";


        document.getElementById(
            "successMessage"
        ).scrollIntoView({
            behavior: "smooth"
        });

    }
);


document.addEventListener(
    "DOMContentLoaded",
    loadProfile
);

</script>

</body>
</html>
