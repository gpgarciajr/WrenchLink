<script>
(function () {
    "use strict";

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("loginMessage");
    const button = document.getElementById("loginButton");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "login-message " + type;
    }

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        message.textContent = "";
        message.className = "login-message";

        if (!email || !password) {
            showMessage("Please enter both your email address and password.", "error");
            return;
        }

        let users;

        try {
            users = JSON.parse(localStorage.getItem("wrenchlinkUsers") || "[]");
        } catch (error) {
            showMessage("Your saved account data could not be read. Please refresh the page and try again.", "error");
            return;
        }

        if (!Array.isArray(users)) {
            showMessage("Your saved account data is invalid. Please contact support.", "error");
            return;
        }

        const user = users.find(function (account) {
            return account &&
                String(account.email || "").trim().toLowerCase() === email;
        });

        if (!user) {
            showMessage(
                "ACCOUNT DOES NOT EXIST. No WrenchLink account was found with that email address. Check the email or create an account.",
                "error"
            );
            return;
        }

        if (String(user.password || "") !== password) {
            showMessage("INCORRECT PASSWORD. That email is registered, but the password doesn't match.", "error");
            passwordInput.value = "";
            passwordInput.focus();
            return;
        }

        const currentUser = {
            id: user.id,
            firstName: user.firstName || "",
            lastName: user.lastName || "",
            name: user.name || (
                (user.firstName || "") + " " + (user.lastName || "")
            ).trim(),
            email: user.email,
            role: user.role || "customer",
            mechanicId: user.mechanicId || null
        };

        try {
            if (typeof setCurrentUser === "function") {
                setCurrentUser(currentUser);
            } else {
                localStorage.setItem(
                    "wrenchlinkCurrentUser",
                    JSON.stringify(currentUser)
                );
            }
        } catch (error) {
            showMessage("We couldn't save your login session. Please try again.", "error");
            return;
        }

        showMessage("Login successful! Opening your dashboard...", "success");
        button.disabled = true;

        const role = String(user.role || "customer").toLowerCase();

        if (role === "admin") {
            window.location.href = "admin/index.html";
        } else if (role === "mechanic") {
            window.location.href = "mechanic-dashboard.html";
        } else {
            window.location.href = "customer-dashboard.html";
        }
    });
})();
</script>
