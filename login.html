<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In | WrenchLink</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        🔧 WrenchLink
    </div>

    <a href="index.html" class="btn btn-small">
        Back to WrenchLink
    </a>

</header>


<main>

<section class="services">

    <div class="section-heading">

        <p class="eyebrow">
            WRENCHLINK
        </p>

        <h1>
            Sign In
        </h1>

        <p>
            Sign in to your WrenchLink account.
        </p>

    </div>


    <div class="service-card">

        <form>

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="btn btn-primary"
            >
                Sign In
            </button>

        </form>


        <p style="margin-top: 20px;">
            Don't have an account?
        </p>

        <a
            href="signup.html"
            class="btn"
        >
            Create Account
        </a>

    </div>

</section>

</main>


<footer class="footer">

    <div>
        <strong>🔧 WrenchLink</strong>

        <p>
            Connecting drivers with mobile mechanics.
        </p>
    </div>


    <div class="footer-links">

        <a href="privacy.html">
            Privacy
        </a>

        <a href="terms.html">
            Terms
        </a>

        <a href="contact.html">
            Contact
        </a>

    </div>

</footer>

</body>

</html>
