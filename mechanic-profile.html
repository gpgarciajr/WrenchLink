<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanic Profile | WrenchLink</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="container">
        <a href="index.html" class="logo">🔧 WrenchLink</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="mechanics.html">Find a Mechanic</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a id="accountLink" href="login.html" class="btn btn-small">
                Sign In
            </a>
        </nav>
    </div>
</header>


<main>

    <section class="page-header">
        <div class="container">

            <p class="eyebrow">MECHANIC PROFILE</p>

            <h1 id="mechanicName">Loading...</h1>

            <p id="mechanicLocation"></p>

            <p id="mechanicAvailability"></p>

        </div>
    </section>


    <section>
        <div class="container">

            <div id="profileMessage"></div>

            <div class="dashboard-grid">

                <div class="dashboard-card">

                    <h2>About</h2>

                    <p id="mechanicAbout">
                        Loading...
                    </p>

                </div>


                <div class="dashboard-card">

                    <h2>Experience</h2>

                    <p id="mechanicExperience">
                        Loading...
                    </p>

                    <p id="mechanicRating">
                        Loading...
                    </p>

                    <p id="mechanicReviews">
                        Loading...
                    </p>

                    <p id="mechanicRadius">
                        Loading...
                    </p>

                </div>

            </div>


            <div class="dashboard-card">

                <h2>Services</h2>

                <div id="mechanicServices">
                    Loading...
                </div>

            </div>


            <div class="dashboard-card" id="contactCard" hidden>

                <h2>Contact</h2>

                <p id="mechanicPhone"></p>

                <p id="mechanicEmail"></p>

            </div>


            <div class="dashboard-card">

                <h2>Customer Reviews</h2>

                <div id="reviewsList">
                    Loading...
                </div>

            </div>


            <div id="profileActions"></div>

        </div>
    </section>

</main>


<footer>
    <div class="container">

        <p>&copy; 2026 WrenchLink. All rights reserved.</p>

        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="contact.html">Contact</a>

    </div>
</footer>


<script src="app.js"></script>
<script src="marketplace-data.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    "use strict";


    function readStorage(key, fallback) {

        try {

            const value = localStorage.getItem(key);

            if (!value) return fallback;

            return JSON.parse(value);

        } catch (error) {

            return fallback;

        }

    }


    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function normalizeServices(services) {

        if (Array.isArray(services)) {
            return services
                .map(item => String(item).trim())
                .filter(Boolean);
        }

        if (typeof services === "string") {

            return services
                .split(",")
                .map(item => item.trim())
                .filter(Boolean);

        }

        return [];

    }


    const params = new URLSearchParams(
        window.location.search
    );


    const mechanicId = params.get("id");


    const nameElement =
        document.getElementById("mechanicName");

    const locationElement =
        document.getElementById("mechanicLocation");

    const availabilityElement =
        document.getElementById("mechanicAvailability");

    const aboutElement =
        document.getElementById("mechanicAbout");

    const experienceElement =
        document.getElementById("mechanicExperience");

    const ratingElement =
        document.getElementById("mechanicRating");

    const reviewsElement =
        document.getElementById("mechanicReviews");

    const radiusElement =
        document.getElementById("mechanicRadius");

    const servicesElement =
        document.getElementById("mechanicServices");

    const phoneElement =
        document.getElementById("mechanicPhone");

    const emailElement =
        document.getElementById("mechanicEmail");

    const contactCard =
        document.getElementById("contactCard");

    const reviewsList =
        document.getElementById("reviewsList");

    const actionsElement =
        document.getElementById("profileActions");

    const messageElement =
        document.getElementById("profileMessage");


    if (!mechanicId) {

        nameElement.textContent =
            "Mechanic Not Found";

        messageElement.innerHTML =
            `<p>
                No mechanic was selected.
                <a href="mechanics.html">Browse mechanics</a>.
            </p>`;

        return;

    }


    const users =
        readStorage("wrenchlinkUsers", []);


    const profiles =
        readStorage("wrenchlinkMechanicProfiles", {});


    const areas =
        readStorage("wrenchlinkServiceAreas", {});


    const reviews =
        readStorage("wrenchlinkReviews", []);


    const realUser =
        users.find(function (user) {

            return (
                user.id === mechanicId &&
                user.role === "mechanic"
            );

        });


    const savedProfile =
        profiles[mechanicId] || null;


    const savedArea =
        areas[mechanicId] || null;


    let mechanic =
        realUser || savedProfile;


    const demoMechanic =
        typeof getMarketplaceMechanicById === "function"
            ? getMarketplaceMechanicById(mechanicId)
            : null;


    if (!mechanic && demoMechanic) {
        mechanic = demoMechanic;
    }


    if (!mechanic) {

        nameElement.textContent =
            "Mechanic Not Found";

        messageElement.innerHTML =
            `<p>
                We could not find that mechanic.
                <a href="mechanics.html">Return to the marketplace</a>.
            </p>`;

        return;

    }


    const services =
        normalizeServices(
            savedProfile?.services ??
            mechanic.services ??
            demoMechanic?.services
        );


    const city =
        savedArea?.city ||
        savedProfile?.city ||
        mechanic.city ||
        demoMechanic?.city ||
        "";


    const state =
        savedArea?.state ||
        savedProfile?.state ||
        mechanic.state ||
        demoMechanic?.state ||
        "";


    const zip =
        savedArea?.zip ||
        savedProfile?.zip ||
        mechanic.zip ||
        demoMechanic?.zip ||
        "";


    const experience =
        savedProfile?.experience ??
        mechanic.experience ??
        demoMechanic?.experience ??
        0;


    const about =
        savedProfile?.about ||
        mechanic.about ||
        demoMechanic?.about ||
        "No biography has been provided.";


    const radius =
        savedArea?.radius ??
        savedProfile?.serviceRadius ??
        mechanic.serviceRadius ??
        demoMechanic?.serviceRadius ??
        null;


    const available =
        savedProfile?.available ??
        mechanic.available ??
        demoMechanic?.available ??
        true;


    const mechanicReviews =
        reviews.filter(function (review) {

            return review.mechanicId === mechanicId;

        });


    let rating = 0;


    if (mechanicReviews.length) {

        const total =
            mechanicReviews.reduce(
                function (sum, review) {

                    return sum +
                        (Number(review.rating) || 0);

                },
                0
            );


        rating =
            total / mechanicReviews.length;

    } else {

        rating =
            Number(
                savedProfile?.rating ??
                mechanic.rating ??
                demoMechanic?.rating ??
                0
            );

    }


    const reviewCount =
        mechanicReviews.length ||
        Number(
            savedProfile?.reviewCount ??
            mechanic.reviews ??
            demoMechanic?.reviews ??
            0
        );


    nameElement.textContent =
        savedProfile?.name ||
        mechanic.name ||
        "WrenchLink Mechanic";


    const locationParts = [
        city,
        state,
        zip
    ].filter(Boolean);


    locationElement.textContent =
        locationParts.length
            ? locationParts.join(", ")
            : "Service location not provided";


    availabilityElement.textContent =
        available
            ? "Available"
            : "Currently unavailable";


    aboutElement.textContent =
        about;


    experienceElement.textContent =
        `${Number(experience) || 0} years of experience`;


    ratingElement.textContent =
        rating > 0
            ? `Rating: ${rating.toFixed(1)} / 5`
            : "Rating: No ratings yet";


    reviewsElement.textContent =
        `${reviewCount} review${reviewCount === 1 ? "" : "s"}`;


    radiusElement.textContent =
        radius
            ? `Service area: up to ${radius} miles`
            : "Service area: Not provided";


    if (services.length) {

        servicesElement.innerHTML =
            services.map(function (service) {

                return `
                    <span class="service-tag">
                        ${escapeHTML(service)}
                    </span>
                `;

            }).join(" ");

    } else {

        servicesElement.textContent =
            "No services listed.";

    }


    const phone =
        savedProfile?.phone ||
        mechanic.phone ||
        "";


    const email =
        savedProfile?.email ||
        mechanic.email ||
        "";


    if (phone || email) {

        contactCard.hidden = false;


        if (phone) {

            phoneElement.innerHTML =
                `Phone:
                 <a href="tel:${escapeHTML(phone)}">
                    ${escapeHTML(phone)}
                 </a>`;

        } else {

            phoneElement.textContent = "";

        }


        if (email) {

            emailElement.innerHTML =
                `Email:
                 <a href="mailto:${escapeHTML(email)}">
                    ${escapeHTML(email)}
                 </a>`;

        } else {

            emailElement.textContent = "";

        }

    }


    if (!mechanicReviews.length) {

        if (demoMechanic?.reviews) {

            reviewsList.innerHTML = `
                <p>
                    This mechanic currently has
                    ${escapeHTML(demoMechanic.reviews)}
                    marketplace reviews with an average rating of
                    ${escapeHTML(Number(demoMechanic.rating).toFixed(1))}.
                </p>
            `;

        } else {

            reviewsList.innerHTML =
                "<p>No customer reviews yet.</p>";

        }

    } else {

        const sortedReviews =
            [...mechanicReviews].sort(
                function (a, b) {

                    return new Date(b.createdAt || 0) -
                           new Date(a.createdAt || 0);

                }
            );


        reviewsList.innerHTML =
            sortedReviews.map(function (review) {

                const stars =
                    "★".repeat(
                        Math.max(
                            0,
                            Math.min(
                                5,
                                Number(review.rating) || 0
                            )
                        )
                    );


                return `
                    <div class="review-item">

                        <strong>
                            ${escapeHTML(
                                review.customerName ||
                                "Customer"
                            )}
                        </strong>

                        <p>
                            ${escapeHTML(stars)}
                        </p>

                        <p>
                            ${escapeHTML(
                                review.comment ||
                                "No written comment."
                            )}
                        </p>

                        <small>
                            ${escapeHTML(
                                new Date(
                                    review.createdAt
                                ).toLocaleDateString()
                            )}
                        </small>

                    </div>
                `;

            }).join("");

    }


    const currentUser =
        readStorage(
            "wrenchlinkCurrentUser",
            null
        );


    const isOwnProfile =
        currentUser &&
        currentUser.role === "mechanic" &&
        currentUser.id === mechanicId;


    if (isOwnProfile) {

        const accountLink =
            document.getElementById("accountLink");


        accountLink.href =
            "mechanic-dashboard.html";

        accountLink.textContent =
            "Dashboard";


        actionsElement.innerHTML = `
            <div class="dashboard-card">

                <h2>Manage Your Profile</h2>

                <a
                    href="edit-mechanic-profile.html"
                    class="btn"
                >
                    Edit My Profile
                </a>

                <a
                    href="service-area.html"
                    class="btn"
                >
                    Edit Service Area
                </a>

                <a
                    href="mechanic-dashboard.html"
                    class="btn"
                >
                    Mechanic Dashboard
                </a>

            </div>
        `;

    } else {

        actionsElement.innerHTML = `
            <div class="dashboard-card">

                <h2>Need This Mechanic?</h2>

                <p>
                    Request this mechanic for your job.
                </p>

                <a
                    href="post-job.html?mechanic=${encodeURIComponent(mechanicId)}"
                    class="btn"
                >
                    Request This Mechanic
                </a>

            </div>
        `;

    }

});

</script>

</body>
</html>
```
