<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Post a Job | WrenchLink</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header class="site-header">

    <div class="container nav-container">

        <a
            href="index.html"
            class="logo"
        >
            🔧 WrenchLink
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="mechanics.html">
                Find a Mechanic
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="about.html">
                About
            </a>

            <a
                href="login.html"
                class="btn btn-small"
            >
                Sign In
            </a>

        </nav>

    </div>

</header>


<main class="container">

    <section class="page-hero">

        <p class="eyebrow">
            WRENCHLINK SERVICE REQUEST
        </p>

        <h1>
            Post a Job
        </h1>

        <p>
            Tell the mechanic what your vehicle needs.
        </p>

    </section>


    <section
        id="selectedMechanicBox"
        class="card"
        style="display:none;"
    >

        <p class="eyebrow">
            REQUESTING
        </p>

        <h2 id="selectedMechanicName"></h2>

        <p id="selectedMechanicDetails"></p>

        <button
            type="button"
            class="btn btn-secondary"
            id="changeMechanic"
        >
            Choose a Different Mechanic
        </button>

    </section>


    <section class="card">

        <form id="jobForm">

            <div class="form-group">

                <label for="vehicle">
                    Vehicle
                </label>

                <input
                    id="vehicle"
                    type="text"
                    placeholder="2019 Kia Soul 1.6L"
                    required
                >

            </div>


            <div class="form-group">

                <label for="service">
                    Service Needed
                </label>

                <select
                    id="service"
                    required
                >

                    <option value="">
                        Select a service
                    </option>

                    <option value="Brakes & Rotors">
                        Brakes & Rotors
                    </option>

                    <option value="Battery">
                        Battery
                    </option>

                    <option value="Alternator">
                        Alternator
                    </option>

                    <option value="Starter">
                        Starter
                    </option>

                    <option value="Diagnostics">
                        Diagnostics
                    </option>

                    <option value="Oil Change">
                        Oil Change
                    </option>

                    <option value="Roadside Assistance">
                        Roadside Assistance
                    </option>

                    <option value="Tire Assistance">
                        Tire Assistance
                    </option>

                    <option value="Other Repairs">
                        Other Repairs
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="problem">
                    Describe the Problem
                </label>

                <textarea
                    id="problem"
                    rows="5"
                    placeholder="Describe what is happening with the vehicle..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="city">
                    Service City
                </label>

                <input
                    id="city"
                    type="text"
                    placeholder="Chicago"
                    required
                >

            </div>


            <div class="form-group">

                <label for="state">
                    State
                </label>

                <input
                    id="state"
                    type="text"
                    maxlength="2"
                    placeholder="IL"
                    required
                >

            </div>


            <div class="form-group">

                <label for="zip">
                    ZIP Code
                </label>

                <input
                    id="zip"
                    type="text"
                    placeholder="60618"
                    required
                >

            </div>


            <div class="form-group">

                <label for="address">
                    Service Address
                </label>

                <input
                    id="address"
                    type="text"
                    placeholder="Where the vehicle is located"
                    required
                >

            </div>


            <div class="form-group">

                <label for="preferredDateTime">
                    Preferred Date & Time
                </label>

                <input
                    id="preferredDateTime"
                    type="datetime-local"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn"
            >
                Submit Service Request
            </button>

        </form>


        <div
            id="successMessage"
            style="display:none;"
        >

            <h2>
                Request Submitted
            </h2>

            <p id="successText"></p>

            <div class="button-row">

                <a
                    href="customer-dashboard.html"
                    class="btn"
                >
                    View Dashboard
                </a>

                <a
                    href="mechanics.html"
                    class="btn btn-secondary"
                >
                    Find Another Mechanic
                </a>

            </div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="container">

        <p>
            © 2026 WrenchLink. All rights reserved.
        </p>

        <div>

            <a href="privacy.html">
                Privacy
            </a>

            <a href="terms.html">
                Terms
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>

    </div>

</footer>


<script src="marketplace-data.js"></script>


<script>

let selectedMechanic = null;


function loadCustomerProfile() {

    const profile =
        JSON.parse(
            localStorage.getItem(
                "wrenchlinkCustomerProfile"
            )
        ) || {};


    if (profile.vehicle) {

        document.getElementById(
            "vehicle"
        ).value =
            profile.vehicle;

    }


    if (profile.city) {

        document.getElementById(
            "city"
        ).value =
            profile.city;

    }


    if (profile.state) {

        document.getElementById(
            "state"
        ).value =
            profile.state;

    }


    if (profile.zip) {

        document.getElementById(
            "zip"
        ).value =
            profile.zip;

    }

}


function loadSelectedMechanic() {

    const mechanic =
        getRequestedMechanicFromURL();


    if (!mechanic) {

        return;

    }


    selectedMechanic =
        mechanic;


    document.getElementById(
        "selectedMechanicBox"
    ).style.display =
        "block";


    document.getElementById(
        "selectedMechanicName"
    ).textContent =
        mechanic.name;


    document.getElementById(
        "selectedMechanicDetails"
    ).textContent =

        mechanic.city +
        ", " +
        mechanic.state +
        " • " +
        mechanic.experience +
        " years experience";

}


document
    .getElementById(
        "changeMechanic"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "mechanics.html";

        }
    );


document
    .getElementById(
        "jobForm"
    )
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const profile =
                JSON.parse(
                    localStorage.getItem(
                        "wrenchlinkCustomerProfile"
                    )
                ) || {};


            const job = {

                id:
                    Date.now(),

                customerName:
                    profile.name ||
                    "WrenchLink Customer",

                customerEmail:
                    profile.email ||
                    "",

                customerPhone:
                    profile.phone ||
                    "",

                vehicle:
                    document
                        .getElementById(
                            "vehicle"
                        )
                        .value
                        .trim(),

                service:
                    document
                        .getElementById(
                            "service"
                        )
                        .value,

                description:
                    document
                        .getElementById(
                            "problem"
                        )
                        .value
                        .trim(),

                city:
                    document
                        .getElementById(
                            "city"
                        )
                        .value
                        .trim(),

                state:
                    document
                        .getElementById(
                            "state"
                        )
                        .value
                        .trim()
                        .toUpperCase(),

                zip:
                    document
                        .getElementById(
                            "zip"
                        )
                        .value
                        .trim(),

                location:
                    document
                        .getElementById(
                            "address"
                        )
                        .value
                        .trim(),

                preferredDateTime:
                    document
                        .getElementById(
                            "preferredDateTime"
                        )
                        .value,

                status:
                    "Open",

                mechanicId:
                    selectedMechanic
                        ? selectedMechanic.id
                        : null,

                mechanicName:
                    selectedMechanic
                        ? selectedMechanic.name
                        : null,

                requestedMechanic:
                    Boolean(
                        selectedMechanic
                    ),

                acceptedAt:
                    null,

                completedAt:
                    null,

                createdAt:
                    new Date().toISOString()

            };


            saveWrenchLinkJob(
                job
            );


            document.getElementById(
                "jobForm"
            ).style.display =
                "none";


            document.getElementById(
                "selectedMechanicBox"
            ).style.display =
                "none";


            document.getElementById(
                "successMessage"
            ).style.display =
                "block";


            document.getElementById(
                "successText"
            ).textContent =

                selectedMechanic

                    ? "Your request has been created for " +
                      selectedMechanic.name +
                      ". The request is currently open."

                    : "Your service request has been created and is now open for mechanics to review.";


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }
    );


document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadCustomerProfile();

        loadSelectedMechanic();

    }
);

</script>

</body>

</html>
