<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile | WrenchLink</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <div class="container nav-container">

```
    <a href="index.html" class="logo">🔧 WrenchLink</a>

    <nav>
        <a href="customer-dashboard.html">Dashboard</a>
        <a href="index.html">Home</a>
    </nav>

</div>
```

</header>

<main class="container">

```
<section class="page-header">
    <h2>Customer Profile</h2>
    <p>Keep your information ready for your next service request.</p>
</section>

<section class="card">

    <form id="profileForm">

        <label for="name">Full Name</label>
        <input
            id="name"
            type="text"
            autocomplete="name"
            required
        >

        <label for="email">Email</label>
        <input
            id="email"
            type="email"
            autocomplete="email"
            required
        >

        <label for="phone">Phone</label>
        <input
            id="phone"
            type="tel"
            autocomplete="tel"
        >

        <label for="city">City</label>
        <input
            id="city"
            type="text"
            autocomplete="address-level2"
        >

        <label for="state">State</label>
        <input
            id="state"
            type="text"
            value="IL"
            maxlength="2"
            autocomplete="address-level1"
        >

        <label for="zip">ZIP Code</label>
        <input
            id="zip"
            type="text"
            inputmode="numeric"
            autocomplete="postal-code"
        >

        <label for="vehicle">Primary Vehicle</label>
        <input
            id="vehicle"
            type="text"
            placeholder="Example: 2019 Kia Soul 1.6L"
        >

        <label for="notes">Additional Information</label>
        <textarea
            id="notes"
            rows="5"
            placeholder="Anything you'd like mechanics to know..."
        ></textarea>

        <button type="submit">Save Profile</button>

    </form>

    <div id="message" class="form-message" hidden>
        <h3>Profile Saved ✓</h3>
        <p>Your customer information has been saved.</p>
        <p>
            <a href="customer-dashboard.html">Return to Dashboard</a>
        </p>
    </div>

</section>
```

</main>

<footer class="site-footer">
    <div class="container">

    <p>© 2026 WrenchLink. All rights reserved.</p>

    <p>
        <a href="privacy.html">Privacy</a> |

        <a href="contact.html">Contact</a>
    </p>

</div>

</footer>

<script src="app.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const currentUser = getCurrentUser();

    /*
     * Customer profile pages require a logged-in customer.
     */
    if (!currentUser) {
        window.location.href = "login.html";
        return;
    }

    if (currentUser.role === "mechanic") {
        window.location.href = "mechanic-dashboard.html";
        return;
    }

    if (currentUser.role === "admin") {
        window.location.href = "admin/index.html";
        return;
    }

    const profileForm = document.getElementById("profileForm");
    const message = document.getElementById("message");

    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");
    const cityInput = document.getElementById("city");
    const stateInput = document.getElementById("state");
    const zipInput = document.getElementById("zip");
    const vehicleInput = document.getElementById("vehicle");
    const notesInput = document.getElementById("notes");

    /*
     * Customer profiles are stored separately by user ID.
     *
     * Example:
     * wrenchlinkCustomerProfiles = {
     *     "WL-12345": {
     *         name: "...",
     *         email: "...",
     *         ...
     *     }
     * }
     */
    let allProfiles = WrenchLinkStorage.get(
        "wrenchlinkCustomerProfiles",
        {}
    );

    if (!allProfiles || typeof allProfiles !== "object") {
        allProfiles = {};
    }

    const savedProfile = allProfiles[currentUser.id] || {};

    /*
     * Load saved profile information.
     */
    nameInput.value =
        savedProfile.name ||
        currentUser.name ||
        "";

    emailInput.value =
        savedProfile.email ||
        currentUser.email ||
        "";

    phoneInput.value =
        savedProfile.phone ||
        currentUser.phone ||
        "";

    cityInput.value =
        savedProfile.city ||
        "";

    stateInput.value =
        savedProfile.state ||
        "IL";

    zipInput.value =
        savedProfile.zip ||
        "";

    vehicleInput.value =
        savedProfile.vehicle ||
        "";

    notesInput.value =
        savedProfile.notes ||
        "";

    /*
     * Save customer profile.
     */
    profileForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const profile = {
            userId: currentUser.id,

            name: nameInput.value.trim(),

            email: emailInput.value.trim(),

            phone: phoneInput.value.trim(),

            city: cityInput.value.trim(),

            state: stateInput.value.trim().toUpperCase(),

            zip: zipInput.value.trim(),

            vehicle: vehicleInput.value.trim(),

            notes: notesInput.value.trim(),

            updatedAt: new Date().toISOString()
        };

        /*
         * Save this customer's profile under THEIR user ID.
         */
        allProfiles[currentUser.id] = profile;

        WrenchLinkStorage.set(
            "wrenchlinkCustomerProfiles",
            allProfiles
        );

        /*
         * Keep the current user's basic information
         * synchronized with the profile.
         */
        const updatedUser = {
            ...currentUser,
            name: profile.name,
            firstName: profile.name.split(" ")[0],
            lastName: profile.name
                .split(" ")
                .slice(1)
                .join(" "),
            email: profile.email,
            phone: profile.phone
        };

        setCurrentUser(updatedUser);

        /*
         * Also update the stored user record.
         */
        const users = WrenchLinkStorage.get(
            "wrenchlinkUsers",
            []
        );

        if (Array.isArray(users)) {

            const userIndex = users.findIndex(function (user) {
                return user.id === currentUser.id;
            });

            if (userIndex !== -1) {

                users[userIndex] = {
                    ...users[userIndex,
                    name: profile.name,
                    firstName: profile.name.split(" ")[0],
                    lastName: profile.name
                        .split(" ")
                        .slice(1)
                        .join(" "),
                    email: profile.email,
                    phone: profile.phone
                };

                WrenchLinkStorage.set(
                    "wrenchlinkUsers",
                    users
                );
            }
        }

        /*
         * Show confirmation.
         */
        message.hidden = false;

        message.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    });

});

</script>

</body>
</html>
