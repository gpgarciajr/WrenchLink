<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post a Job | WrenchLink</title>

    <link rel="stylesheet" href="style.css">

    <script src="app.js" defer></script>
    <script src="marketplace-data.js" defer></script>
</head>

<body>

<header>
    <div class="container">

        <div class="header-content">

            <a href="index.html" class="logo">
                🔧 WrenchLink
            </a>

            <nav>
                <a href="customer-dashboard.html">Dashboard</a>
                <a href="mechanics.html">Find a Mechanic</a>
                <a href="services.html">Services</a>
            </nav>

        </div>

    </div>
</header>


<main class="container">

    <section class="page-header">

        <h1>Post a Service Request</h1>

        <p>
            Tell WrenchLink what your vehicle needs and let mechanics respond.
        </p>

    </section>


    <section>

        <div id="selectedMechanicContainer"></div>

        <div id="message"></div>


        <form id="jobForm">

            <div>

                <label for="vehicle">
                    Vehicle
                </label>

                <input
                    type="text"
                    id="vehicle"
                    required
                    maxlength="150"
                    placeholder="Year Make Model"
                >

            </div>


            <div>

                <label for="service">
                    Service Needed
                </label>

                <select
                    id="service"
                    required
                >

                    <option value="">
                        Select a service
                    </option>

                    <option value="Oil Change">
                        Oil Change
                    </option>

                    <option value="Brake Repair">
                        Brake Repair
                    </option>

                    <option value="Battery Replacement">
                        Battery Replacement
                    </option>

                    <option value="Alternator Replacement">
                        Alternator Replacement
                    </option>

                    <option value="Starter Replacement">
                        Starter Replacement
                    </option>

                    <option value="Belt Replacement">
                        Belt Replacement
                    </option>

                    <option value="Diagnostic">
                        Diagnostic
                    </option>

                    <option value="AC Repair">
                        A/C Repair
                    </option>

                    <option value="Cooling System">
                        Cooling System
                    </option>

                    <option value="Suspension Repair">
                        Suspension Repair
                    </option>

                    <option value="Tire Service">
                        Tire Service
                    </option>

                    <option value="Electrical Repair">
                        Electrical Repair
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div>

                <label for="description">
                    Describe the Problem
                </label>

                <textarea
                    id="description"
                    rows="6"
                    maxlength="2000"
                    required
                    placeholder="Describe the problem, symptoms, parts you already have, or anything else the mechanic should know."
                ></textarea>

            </div>


            <div>

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    required
                    maxlength="100"
                >

            </div>


            <div>

                <label for="state">
                    State
                </label>

                <input
                    type="text"
                    id="state"
                    required
                    maxlength="2"
                    placeholder="IL"
                    style="text-transform: uppercase;"
                >

            </div>


            <div>

                <label for="zip">
                    ZIP Code
                </label>

                <input
                    type="text"
                    id="zip"
                    required
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="60601"
                >

            </div>


            <div>

                <label for="location">
                    Service Address
                </label>

                <input
                    type="text"
                    id="location"
                    maxlength="200"
                    placeholder="Street address or meeting location"
                >

            </div>


            <div>

                <label for="preferredDateTime">
                    Preferred Date and Time
                </label>

                <input
                    type="datetime-local"
                    id="preferredDateTime"
                    required
                >

            </div>


            <div>

                <button
                    type="submit"
                >
                    Post Job
                </button>

                <button
                    type="button"
                    onclick="window.location.href='customer-dashboard.html'"
                >
                    Cancel
                </button>

            </div>

        </form>

    </section>

</main>


<script>

let currentUser = null;
let selectedMechanic = null;


/* =========================================================
   STORAGE
========================================================= */

function getStorage(key, fallback) {

    const value =
        localStorage.getItem(key);

    if (!value) {
        return fallback;
    }

    try {
        return JSON.parse(value);
    } catch (error) {
        return fallback;
    }
}


function setStorage(key, value) {

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );
}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(message, success = false) {

    const element =
        document.getElementById("message");

    element.textContent =
        message;

    element.style.padding =
        "10px";

    element.style.marginBottom =
        "15px";

    element.style.border =
        "1px solid";

    element.style.borderColor =
        success
            ? "green"
            : "red";
}


/* =========================================================
   ACCESS
========================================================= */

function checkCustomerAccess() {

    currentUser =
        getStorage(
            "wrenchlinkCurrentUser",
            null
        );


    if (!currentUser) {

        window.location.href =
            "login.html";

        return false;
    }


    if (currentUser.role === "mechanic") {

        window.location.href =
            "mechanic-dashboard.html";

        return false;
    }


    if (currentUser.role === "admin") {

        window.location.href =
            "admin/index.html";

        return false;
    }


    if (currentUser.role !== "customer") {

        window.location.href =
            "login.html";

        return false;
    }


    return true;
}


/* =========================================================
   CUSTOMER PROFILE
========================================================= */

function loadCustomerProfile() {

    const profiles =
        getStorage(
            "wrenchlinkCustomerProfiles",
            {}
        );


    const profile =
        profiles[currentUser.id];


    if (!profile) {
        return;
    }


    if (profile.vehicle) {

        document.getElementById(
            "vehicle"
        ).value =
            profile.vehicle;
    }


    if (profile.city) {

        document.getElementById(
            "city"
        ).value =
            profile.city;
    }


    if (profile.state) {

        document.getElementById(
            "state"
        ).value =
            profile.state.toUpperCase();
    }


    if (profile.zip) {

        document.getElementById(
            "zip"
        ).value =
            profile.zip;
    }
}


/* =========================================================
   FIND MECHANIC FROM URL
========================================================= */

function getRequestedMechanicId() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    return params.get("mechanic");
}


/* =========================================================
   GET REAL MECHANIC
========================================================= */

function findMechanicById(mechanicId) {

    if (!mechanicId) {
        return null;
    }


    const users =
        getStorage(
            "wrenchlinkUsers",
            []
        );


    const mechanicUser =
        users.find(function(user) {

            return (
                user.id === mechanicId &&
                user.role === "mechanic"
            );

        });


    if (!mechanicUser) {
        return null;
    }


    const profiles =
        getStorage(
            "wrenchlinkMechanicProfiles",
            {}
        );


    const areas =
        getStorage(
            "wrenchlinkServiceAreas",
            {}
        );


    const profile =
        profiles[mechanicUser.id] || {};


    const area =
        areas[mechanicUser.id] || {};


    return {

        id:
            mechanicUser.id,

        name:
            profile.name ||
            mechanicUser.name ||
            "Mechanic",

        email:
            profile.email ||
            mechanicUser.email ||
            "",

        phone:
            profile.phone ||
            mechanicUser.phone ||
            "",

        city:
            profile.city ||
            area.city ||
            "",

        state:
            profile.state ||
            area.state ||
            "",

        zip:
            profile.zip ||
            area.zip ||
            "",

        experience:
            profile.experience ||
            "",

        services:
            profile.services ||
            []

    };
}


/* =========================================================
   SELECTED MECHANIC
========================================================= */

function loadSelectedMechanic() {

    const mechanicId =
        getRequestedMechanicId();


    if (!mechanicId) {
        return;
    }


    selectedMechanic =
        findMechanicById(
            mechanicId
        );


    const container =
        document.getElementById(
            "selectedMechanicContainer"
        );


    if (!selectedMechanic) {

        container.innerHTML = `

            <div class="dashboard-card">

                <h3>Mechanic Not Found</h3>

                <p>
                    The mechanic you selected is no longer available.
                    You can still post your job for other mechanics.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML = `

        <div class="dashboard-card">

            <h2>
                Requesting:
                ${escapeHTML(
                    selectedMechanic.name
                )}
            </h2>

            <p>
                <strong>Location:</strong>
                ${[
                    selectedMechanic.city,
                    selectedMechanic.state
                ]
                    .filter(Boolean)
                    .map(escapeHTML)
                    .join(", ") ||
                    "Not provided"
                }
            </p>

            ${
                selectedMechanic.experience
                    ? `
                        <p>
                            <strong>Experience:</strong>
                            ${escapeHTML(
                                selectedMechanic.experience
                            )}
                        </p>
                    `
                    : ""
            }

            <p>
                Your request will be sent specifically to this mechanic.
            </p>

            <button
                type="button"
                onclick="clearSelectedMechanic()"
            >
                Choose Any Available Mechanic
            </button>

        </div>

    `;
}


/* =========================================================
   CLEAR SELECTED MECHANIC
========================================================= */

function clearSelectedMechanic() {

    selectedMechanic = null;

    window.history.replaceState(
        {},
        document.title,
        "post-job.html"
    );


    const container =
        document.getElementById(
            "selectedMechanicContainer"
        );


    container.innerHTML = "";
}


/* =========================================================
   DATE VALIDATION
========================================================= */

function validatePreferredDateTime(value) {

    if (!value) {
        return false;
    }


    const selectedDate =
        new Date(value);


    if (
        Number.isNaN(
            selectedDate.getTime()
        )
    ) {
        return false;
    }


    return (
        selectedDate.getTime() >
        Date.now()
    );
}


/* =========================================================
   JOB DUPLICATE PROTECTION
========================================================= */

function hasDuplicateJob(
    vehicle,
    service,
    description,
    preferredDateTime
) {

    const jobs =
        getStorage(
            "wrenchlinkJobs",
            []
        );


    const recentLimit =
        Date.now() -
        (
            5 *
            60 *
            1000
        );


    return jobs.some(function(job) {

        return (

            job.customerId ===
            currentUser.id &&

            job.status === "Open" &&

            job.vehicle ===
            vehicle &&

            job.service ===
            service &&

            job.description ===
            description &&

            job.preferredDateTime ===
            preferredDateTime &&

            new Date(
                job.createdAt || 0
            ).getTime() >
            recentLimit

        );

    });
}


/* =========================================================
   SUBMIT JOB
========================================================= */

document.getElementById(
    "jobForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const vehicle =
            document.getElementById(
                "vehicle"
            ).value.trim();


        const service =
            document.getElementById(
                "service"
            ).value.trim();


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        const city =
            document.getElementById(
                "city"
            ).value.trim();


        const state =
            document.getElementById(
                "state"
            ).value.trim()
            .toUpperCase();


        const zip =
            document.getElementById(
                "zip"
            ).value.trim();


        const location =
            document.getElementById(
                "location"
            ).value.trim();


        const preferredDateTime =
            document.getElementById(
                "preferredDateTime"
            ).value;


        /* Required fields */

        if (!vehicle) {

            showMessage(
                "Please enter your vehicle."
            );

            return;
        }


        if (!service) {

            showMessage(
                "Please select a service."
            );

            return;
        }


        if (!description) {

            showMessage(
                "Please describe the problem."
            );

            return;
        }


        if (!city) {

            showMessage(
                "Please enter your city."
            );

            return;
        }


        if (
            !/^[A-Z]{2}$/.test(state)
        ) {

            showMessage(
                "Please enter a valid two-letter state code, such as IL."
            );

            return;
        }


        if (
            !/^\d{5}(-\d{4})?$/.test(zip)
        ) {

            showMessage(
                "Please enter a valid ZIP code."
            );

            return;
        }


        if (
            !validatePreferredDateTime(
                preferredDateTime
            )
        ) {

            showMessage(
                "Please select a future date and time."
            );

            return;
        }


        /* Verify selected mechanic */

        if (selectedMechanic) {

            const verifiedMechanic =
                findMechanicById(
                    selectedMechanic.id
                );


            if (!verifiedMechanic) {

                showMessage(
                    "The selected mechanic is no longer available. Please choose another mechanic."
                );

                selectedMechanic = null;

                return;
            }


            selectedMechanic =
                verifiedMechanic;
        }


        /* Duplicate protection */

        if (
            hasDuplicateJob(
                vehicle,
                service,
                description,
                preferredDateTime
            )
        ) {

            showMessage(
                "You already posted this same job recently."
            );

            return;
        }


        /* Create job */

        const jobs =
            getStorage(
                "wrenchlinkJobs",
                []
            );


        const jobId =
            "JOB-" +
            Date.now() +
            "-" +
            Math.floor(
                Math.random() *
                10000
            );


        const job = {

            id:
                jobId,

            customerId:
                currentUser.id,

            customerName:
                currentUser.name ||
                "",

            customerEmail:
                currentUser.email ||
                "",

            customerPhone:
                currentUser.phone ||
                "",

            vehicle:
                vehicle,

            service:
                service,

            description:
                description,

            city:
                city,

            state:
                state,

            zip:
                zip,

            location:
                location,

            preferredDateTime:
                preferredDateTime,

            status:
                "Open",

            mechanicId:
                selectedMechanic
                    ? selectedMechanic.id
                    : null,

            mechanicName:
                selectedMechanic
                    ? selectedMechanic.name
                    : null,

            mechanicEmail:
                selectedMechanic
                    ? selectedMechanic.email
                    : null,

            mechanicPhone:
                selectedMechanic
                    ? selectedMechanic.phone
                    : null,

            requestedMechanic:
                Boolean(
                    selectedMechanic
                ),

            acceptedAt:
                null,

            completedAt:
                null,

            cancelledAt:
                null,

            createdAt:
                new Date().toISOString()

        };


        jobs.push(job);


        setStorage(
            "wrenchlinkJobs",
            jobs
        );


        showMessage(
            selectedMechanic
                ? "Your request has been sent to " +
                  selectedMechanic.name +
                  "."
                : "Your job has been posted successfully.",
            true
        );


        setTimeout(
            function() {

                window.location.href =
                    "customer-dashboard.html";

            },
            900
        );

    }
);


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        if (!checkCustomerAccess()) {
            return;
        }


        loadCustomerProfile();

        loadSelectedMechanic();

    }
);

</script>

</body>
</html>
```
