<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile | WrenchLink</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="container">
        <h1><a href="index.html">🔧 WrenchLink</a></h1>

        <nav>
            <a href="customer-dashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="page-header">
        <h2>Customer Profile</h2>
        <p>Keep your information ready for your next service request.</p>
    </section>

    <section class="card">

        <form id="profileForm">

            <label for="name">Full Name</label>
            <input id="name" type="text" required>

            <label for="email">Email</label>
            <input id="email" type="email" required>

            <label for="phone">Phone</label>
            <input id="phone" type="tel">

            <label for="city">City</label>
            <input id="city" type="text">

            <label for="state">State</label>
            <input id="state" type="text" value="IL">

            <label for="zip">ZIP Code</label>
            <input id="zip" type="text">

            <label for="vehicle">Primary Vehicle</label>
            <input
                id="vehicle"
                type="text"
                placeholder="Example: 2019 Kia Soul 1.6L"
            >

            <label for="notes">Additional Information</label>
            <textarea
                id="notes"
                rows="5"
                placeholder="Anything you'd like mechanics to know..."
            ></textarea>

            <button type="submit">Save Profile</button>

        </form>

        <div id="message" style="display:none;">
            <h3>Profile Saved ✓</h3>
            <p>Your customer information has been saved.</p>
        </div>

    </section>

</main>

<footer>
    <div class="container">
        <p>© 2026 WrenchLink. All rights reserved.</p>

        <p>
            <a href="privacy.html">Privacy</a> |
            <a href="terms.html">Terms</a> |
            <a href="contact.html">Contact</a>
        </p>
    </div>
</footer>

<script>

const profileKey = "wrenchlinkCustomerProfile";

function loadProfile() {

    const saved = localStorage.getItem(profileKey);

    if (!saved) return;

    const profile = JSON.parse(saved);

    document.getElementById("name").value = profile.name || "";
    document.getElementById("email").value = profile.email || "";
    document.getElementById("phone").value = profile.phone || "";
    document.getElementById("city").value = profile.city || "";
    document.getElementById("state").value = profile.state || "IL";
    document.getElementById("zip").value = profile.zip || "";
    document.getElementById("vehicle").value = profile.vehicle || "";
    document.getElementById("notes").value = profile.notes || "";
}

document.getElementById("profileForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const profile = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        city: document.getElementById("city").value.trim(),
        state: document.getElementById("state").value.trim(),
        zip: document.getElementById("zip").value.trim(),
        vehicle: document.getElementById("vehicle").value.trim(),
        notes: document.getElementById("notes").value.trim()
    };

    localStorage.setItem(
        profileKey,
        JSON.stringify(profile)
    );

    document.getElementById("message").style.display = "block";

    document.getElementById("message").scrollIntoView({
        behavior: "smooth"
    });
});

document.addEventListener("DOMContentLoaded", loadProfile);

</script>

</body>
</html>
