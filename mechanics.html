<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Find a Mechanic | WrenchLink</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header class="site-header">

    <div class="container nav-container">

        <a
            href="index.html"
            class="logo"
        >
            🔧 WrenchLink
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="mechanics.html">
                Find a Mechanic
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="about.html">
                About
            </a>

            <a
                href="login.html"
                class="btn btn-small"
            >
                Sign In
            </a>

        </nav>

    </div>

</header>


<main class="container">

    <section class="page-hero">

        <p class="eyebrow">
            WRENCHLINK MARKETPLACE
        </p>

        <h1>
            Find a Mechanic
        </h1>

        <p>
            Find a mobile mechanic based on
            location, service, rating, and availability.
        </p>

    </section>


    <section class="card">

        <h2>
            Search Mechanics
        </h2>

        <form id="mechanicSearchForm">

            <div class="form-group">

                <label for="location">
                    City or ZIP Code
                </label>

                <input
                    id="location"
                    type="text"
                    placeholder="Chicago or 60618"
                >

            </div>


            <div class="form-group">

                <label for="service">
                    Service
                </label>

                <select id="service">

                    <option value="">
                        All Services
                    </option>

                    <option value="Brakes & Rotors">
                        Brakes & Rotors
                    </option>

                    <option value="Battery">
                        Battery
                    </option>

                    <option value="Alternator">
                        Alternator
                    </option>

                    <option value="Starter">
                        Starter
                    </option>

                    <option value="Diagnostics">
                        Diagnostics
                    </option>

                    <option value="Oil Change">
                        Oil Change
                    </option>

                    <option value="Roadside Assistance">
                        Roadside Assistance
                    </option>

                    <option value="Tire Assistance">
                        Tire Assistance
                    </option>

                    <option value="Other Repairs">
                        Other Repairs
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="availability">
                    Availability
                </label>

                <select id="availability">

                    <option value="">
                        Any Availability
                    </option>

                    <option value="available">
                        Available Now
                    </option>

                    <option value="unavailable">
                        Currently Unavailable
                    </option>

                </select>

            </div>


            <div class="button-row">

                <button
                    type="submit"
                    class="btn"
                >
                    Find Mechanics
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="clearSearch"
                >
                    Clear
                </button>

            </div>

        </form>

    </section>


    <section class="section">

        <div class="section-heading">

            <div>

                <p class="eyebrow">
                    RESULTS
                </p>

                <h2>
                    Mechanics
                </h2>

            </div>

            <span id="resultCount"></span>

        </div>


        <div
            id="mechanicResults"
            class="card-grid"
        ></div>

    </section>

</main>


<footer class="site-footer">

    <div class="container">

        <p>
            © 2026 WrenchLink. All rights reserved.
        </p>

        <div>

            <a href="privacy.html">
                Privacy
            </a>

            <a href="terms.html">
                Terms
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>

    </div>

</footer>


<script src="marketplace-data.js"></script>


<script>

function renderMechanics(
    mechanics
) {

    const container =
        document.getElementById(
            "mechanicResults"
        );

    const count =
        document.getElementById(
            "resultCount"
        );

    count.textContent =
        mechanics.length +
        (
            mechanics.length === 1
                ? " mechanic"
                : " mechanics"
        );


    if (!mechanics.length) {

        container.innerHTML = `

            <div class="card">

                <h3>
                    No mechanics found
                </h3>

                <p>
                    Try changing your location,
                    service, or availability.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        mechanics
            .map(function(mechanic) {

                const rating =
                    calculateMechanicRating(
                        mechanic
                    );

                const availability =
                    mechanic.available
                        ? "Available Now"
                        : "Currently Unavailable";


                const services =
                    mechanic.services
                        .slice(0, 5)
                        .map(
                            function(service) {

                                return `
                                    <span class="service-tag">
                                        ${escapeMarketplaceHTML(service)}
                                    </span>
                                `;

                            }
                        )
                        .join("");


                return `

                    <article class="card">

                        <div
                            style="
                                display:flex;
                                gap:15px;
                                align-items:center;
                                margin-bottom:15px;
                            "
                        >

                            <div
                                style="
                                    font-size:38px;
                                "
                            >
                                🔧
                            </div>

                            <div>

                                <h3>
                                    ${escapeMarketplaceHTML(
                                        mechanic.name
                                    )}
                                </h3>

                                <p>
                                    ${escapeMarketplaceHTML(
                                        mechanic.city
                                    )},
                                    ${escapeMarketplaceHTML(
                                        mechanic.state
                                    )}
                                </p>

                            </div>

                        </div>


                        <p>

                            <strong>
                                ${renderMechanicStars(
                                    rating.rating
                                )}
                            </strong>

                            ${rating.rating
                                ? rating.rating.toFixed(1)
                                : "New"}

                            (${rating.count} reviews)

                        </p>


                        <p>

                            <strong>
                                ${Number(
                                    mechanic.distance || 0
                                ).toFixed(1)}
                                miles
                            </strong>
                            away

                        </p>


                        <p>

                            ${mechanic.experience}
                            years experience

                        </p>


                        <div
                            class="service-tags"
                        >
                            ${services}
                        </div>


                        <p>

                            <strong>
                                ${availability}
                            </strong>

                        </p>


                        <div class="button-row">

                            <a
                                href="
                                    mechanic-profile.html?id=${encodeURIComponent(
                                        mechanic.id
                                    )}
                                "
                                class="btn btn-small"
                            >
                                View Profile
                            </a>

                            <a
                                href="
                                    post-job.html?mechanic=${encodeURIComponent(
                                        mechanic.id
                                    )}
                                "
                                class="btn btn-small"
                            >
                                Request
                            </a>

                        </div>

                    </article>

                `;

            })
            .join("");

}


function searchMechanics() {

    const location =
        document
            .getElementById("location")
            .value
            .trim()
            .toLowerCase();


    const service =
        document
            .getElementById("service")
            .value;


    const availability =
        document
            .getElementById("availability")
            .value;


    let mechanics =
        getMarketplaceMechanics();


    if (location) {

        mechanics =
            mechanics.filter(
                function(mechanic) {

                    return (

                        mechanic.city
                            .toLowerCase()
                            .includes(location)

                        ||

                        mechanic.zip
                            .toLowerCase()
                            .includes(location)

                    );

                }
            );

    }


    if (service) {

        mechanics =
            mechanics.filter(
                function(mechanic) {

                    return mechanic.services.some(
                        function(item) {

                            return item
                                .toLowerCase()
                                .includes(
                                    service.toLowerCase()
                                );

                        }
                    );

                }
            );

    }


    if (
        availability ===
        "available"
    ) {

        mechanics =
            mechanics.filter(
                function(mechanic) {
                    return mechanic.available;
                }
            );

    }


    if (
        availability ===
        "unavailable"
    ) {

        mechanics =
            mechanics.filter(
                function(mechanic) {
                    return !mechanic.available;
                }
            );

    }


    mechanics.sort(
        function(a, b) {

            if (
                a.available !==
                b.available
            ) {

                return a.available
                    ? -1
                    : 1;

            }

            return (
                b.rating -
                a.rating
            );

        }
    );


    renderMechanics(
        mechanics
    );

}


document
    .getElementById(
        "mechanicSearchForm"
    )
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            searchMechanics();

        }
    );


document
    .getElementById(
        "clearSearch"
    )
    .addEventListener(
        "click",
        function() {

            document.getElementById(
                "location"
            ).value = "";

            document.getElementById(
                "service"
            ).value = "";

            document.getElementById(
                "availability"
            ).value = "";

            searchMechanics();

        }
    );


document.addEventListener(
    "DOMContentLoaded",
    function() {

        searchMechanics();

    }
);

</script>

</body>

</html>
