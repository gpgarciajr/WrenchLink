<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Profile | WrenchLink</title>

    <link rel="stylesheet" href="style.css">

    <script src="app.js" defer></script>
</head>

<body>

<header>
    <div class="container">

        <div class="header-content">

            <a href="index.html" class="logo">
                🔧 WrenchLink
            </a>

            <nav>
                <a href="customer-dashboard.html">
                    Dashboard
                </a>

                <a href="mechanics.html">
                    Find a Mechanic
                </a>

                <a href="account-settings.html">
                    Account
                </a>
            </nav>

        </div>

    </div>
</header>


<main class="container">

    <section class="page-header">

        <h1>My Customer Profile</h1>

        <p>
            Keep your contact, location, and vehicle information up to date.
        </p>

    </section>


    <section>

        <div id="message"></div>


        <form id="customerProfileForm">

            <div>

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    maxlength="100"
                >

            </div>


            <div>

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

            </div>


            <div>

                <label for="phone">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    maxlength="30"
                >

            </div>


            <div>

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    maxlength="100"
                >

            </div>


            <div>

                <label for="state">
                    State
                </label>

                <input
                    type="text"
                    id="state"
                    name="state"
                    maxlength="2"
                    placeholder="IL"
                    style="text-transform: uppercase;"
                >

            </div>


            <div>

                <label for="zip">
                    ZIP Code
                </label>

                <input
                    type="text"
                    id="zip"
                    name="zip"
                    maxlength="10"
                    inputmode="numeric"
                >

            </div>


            <div>

                <label for="vehicle">
                    Vehicle
                </label>

                <input
                    type="text"
                    id="vehicle"
                    name="vehicle"
                    maxlength="150"
                    placeholder="Year Make Model"
                >

            </div>


            <div>

                <label for="notes">
                    Vehicle / Service Notes
                </label>

                <textarea
                    id="notes"
                    name="notes"
                    rows="5"
                    maxlength="1000"
                    placeholder="Anything your mechanic should know..."
                ></textarea>

            </div>


            <div>

                <button
                    type="submit"
                >
                    Save Profile
                </button>

                <button
                    type="button"
                    onclick="window.location.href='customer-dashboard.html'"
                >
                    Back to Dashboard
                </button>

            </div>

        </form>

    </section>

</main>


<script>

let currentUser = null;


/* =========================================================
   STORAGE
========================================================= */

function getStorage(key, fallback) {

    const value =
        localStorage.getItem(key);

    if (!value) {
        return fallback;
    }

    try {

        return JSON.parse(value);

    } catch (error) {

        return fallback;

    }
}


function setStorage(key, value) {

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );
}


/* =========================================================
   ACCESS
========================================================= */

function checkAccess() {

    currentUser =
        getStorage(
            "wrenchlinkCurrentUser",
            null
        );


    if (!currentUser) {

        window.location.href =
            "login.html";

        return false;
    }


    if (currentUser.role === "mechanic") {

        window.location.href =
            "mechanic-dashboard.html";

        return false;
    }


    if (currentUser.role === "admin") {

        window.location.href =
            "admin/index.html";

        return false;
    }


    if (currentUser.role !== "customer") {

        window.location.href =
            "login.html";

        return false;
    }


    return true;
}


/* =========================================================
   LOAD PROFILE
========================================================= */

function loadProfile() {

    const profiles =
        getStorage(
            "wrenchlinkCustomerProfiles",
            {}
        );


    const profile =
        profiles[currentUser.id] || {};


    document.getElementById("name").value =
        profile.name ||
        currentUser.name ||
        "";


    document.getElementById("email").value =
        profile.email ||
        currentUser.email ||
        "";


    document.getElementById("phone").value =
        profile.phone ||
        currentUser.phone ||
        "";


    document.getElementById("city").value =
        profile.city ||
        "";


    document.getElementById("state").value =
        profile.state ||
        "";


    document.getElementById("zip").value =
        profile.zip ||
        "";


    document.getElementById("vehicle").value =
        profile.vehicle ||
        "";


    document.getElementById("notes").value =
        profile.notes ||
        "";
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(message, success = false) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        message;


    element.style.padding =
        "10px";


    element.style.marginBottom =
        "15px";


    element.style.border =
        "1px solid";


    element.style.borderColor =
        success
            ? "green"
            : "red";
}


/* =========================================================
   SAVE PROFILE
========================================================= */

document.getElementById(
    "customerProfileForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim()
            .toLowerCase();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const city =
            document.getElementById(
                "city"
            ).value.trim();


        const state =
            document.getElementById(
                "state"
            ).value.trim()
            .toUpperCase();


        const zip =
            document.getElementById(
                "zip"
            ).value.trim();


        const vehicle =
            document.getElementById(
                "vehicle"
            ).value.trim();


        const notes =
            document.getElementById(
                "notes"
            ).value.trim();


        /* Required fields */

        if (!name) {

            showMessage(
                "Please enter your name."
            );

            return;
        }


        if (!email) {

            showMessage(
                "Please enter your email."
            );

            return;
        }


        /* Email validation */

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (
            !emailPattern.test(email)
        ) {

            showMessage(
                "Please enter a valid email address."
            );

            return;
        }


        /* State validation */

        if (
            state &&
            !/^[A-Z]{2}$/.test(state)
        ) {

            showMessage(
                "State must be a two-letter code, such as IL."
            );

            return;
        }


        /* ZIP validation */

        if (
            zip &&
            !/^\d{5}(-\d{4})?$/.test(zip)
        ) {

            showMessage(
                "Please enter a valid ZIP code."
            );

            return;
        }


        /* Load users */

        const users =
            getStorage(
                "wrenchlinkUsers",
                []
            );


        /* Prevent duplicate email */

        const duplicateUser =
            users.find(
                function(user) {

                    return (
                        user.email &&
                        user.email.toLowerCase() ===
                        email &&
                        user.id !==
                        currentUser.id
                    );

                }
            );


        if (duplicateUser) {

            showMessage(
                "That email address is already being used by another account."
            );

            return;
        }


        /* Customer profile */

        const profiles =
            getStorage(
                "wrenchlinkCustomerProfiles",
                {}
            );


        profiles[currentUser.id] = {

            userId:
                currentUser.id,

            name:
                name,

            email:
                email,

            phone:
                phone,

            city:
                city,

            state:
                state,

            zip:
                zip,

            vehicle:
                vehicle,

            notes:
                notes,

            updatedAt:
                new Date().toISOString()

        };


        setStorage(
            "wrenchlinkCustomerProfiles",
            profiles
        );


        /* Update current session */

        currentUser = {

            ...currentUser,

            name:
                name,

            firstName:
                name.split(" ")[0],

            lastName:
                name
                    .split(" ")
                    .slice(1)
                    .join(" "),

            email:
                email,

            phone:
                phone,

            role:
                "customer"

        };


        setStorage(
            "wrenchlinkCurrentUser",
            currentUser
        );


        /* Update stored user */

        const userIndex =
            users.findIndex(
                function(user) {

                    return (
                        user.id ===
                        currentUser.id
                    );

                }
            );


        if (userIndex !== -1) {

            users[userIndex] = {

                ...users[userIndex],

                name:
                    name,

                firstName:
                    name.split(" ")[0],

                lastName:
                    name
                        .split(" ")
                        .slice(1)
                        .join(" "),

                email:
                    email,

                phone:
                    phone,

                role:
                    "customer"

            };


            setStorage(
                "wrenchlinkUsers",
                users
            );
        }


        showMessage(
            "Your customer profile has been saved successfully.",
            true
        );


        setTimeout(
            function() {

                window.location.href =
                    "customer-dashboard.html";

            },
            700
        );

    }
);


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        if (!checkAccess()) {
            return;
        }

        loadProfile();

    }
);

</script>

</body>
</html>
```
