<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Mechanic Profile | WrenchLink</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <a href="index.html"
           class="logo"
           style="text-decoration: none; color: inherit;">
            🔧 WrenchLink
        </a>

        <a href="mechanic-dashboard.html"
           class="btn btn-small">
            ← Dashboard
        </a>

    </header>


    <!-- MAIN -->

    <main>

        <section class="services">

            <div class="section-heading">

                <p class="eyebrow">
                    MECHANIC ACCOUNT
                </p>

                <h1>
                    Edit Your Profile
                </h1>

                <p>
                    Update the information customers see when
                    they view your mechanic profile.
                </p>

            </div>


            <!-- PROFILE FORM -->

            <div class="service-card"
                 style="max-width: 700px; margin: 0 auto; text-align: left;">

                <form id="mechanicProfileForm">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >


                    <label for="serviceArea">
                        Service Area
                    </label>

                    <input
                        type="text"
                        id="serviceArea"
                        placeholder="Example: Chicago, IL"
                        required
                    >


                    <label for="experience">
                        Years of Experience
                    </label>

                    <input
                        type="number"
                        id="experience"
                        min="0"
                        placeholder="Example: 10"
                        required
                    >


                    <label for="services">
                        Services You Provide
                    </label>

                    <textarea
                        id="services"
                        rows="5"
                        placeholder="Example: Brakes, diagnostics, batteries, alternators, starters..."
                        required
                    ></textarea>


                    <label for="about">
                        About You
                    </label>

                    <textarea
                        id="about"
                        rows="6"
                        placeholder="Tell customers about your experience and what makes your service different..."
                    ></textarea>


                    <button
                        type="submit"
                        class="btn btn-primary">
                        Save Profile
                    </button>

                </form>


                <div id="successMessage"
                     style="display: none; margin-top: 20px;">

                    <p>
                        ✅ Your profile changes have been saved.
                    </p>

                    <a href="mechanic-dashboard.html"
                       class="btn btn-small">
                        Return to Dashboard
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div>

            <strong>
                🔧 WrenchLink
            </strong>

            <p>
                Connecting drivers with mobile mechanics.
            </p>

        </div>


        <div class="footer-links">

            <a href="privacy.html">
                Privacy
            </a>

            <a href="terms.html">
                Terms
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>

    </footer>


    <script>

        document
            .getElementById("mechanicProfileForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                document
                    .getElementById("mechanicProfileForm")
                    .style.display = "none";

                document
                    .getElementById("successMessage")
                    .style.display = "block";

            });

    </script>

</body>

</html>
