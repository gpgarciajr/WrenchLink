```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WrenchLink Admin Setup</title>
    <meta name="robots" content="noindex, nofollow">
</head>
<body>
    <h1>WrenchLink Admin Setup</h1>
    <p>This page is reserved for local development.</p>
    <p id="message">Checking environment...</p>

    <form id="setupForm" hidden>
        <label for="name">Administrator Name</label>
        <input id="name" required>

        <label for="email">Administrator Email</label>
        <input id="email" type="email" required>

        <label for="password">Password (minimum 12 characters)</label>
        <input id="password" type="password" minlength="12" required>

        <button type="submit">Create Development Admin</button>
    </form>

    <a href="../index.html">Return to WrenchLink</a>

    <script>
    (() => {
        const message = document.getElementById("message");
        const form = document.getElementById("setupForm");

        const local =
            location.hostname === "localhost" ||
            location.hostname === "127.0.0.1" ||
            location.hostname === "::1" ||
            location.protocol === "file:";

        if (!local) {
            message.textContent =
                "Admin setup is disabled on public websites.";
            return;
        }

        function getUsers() {
            try {
                const users = JSON.parse(
                    localStorage.getItem("wrenchlinkUsers") || "[]"
                );
                return Array.isArray(users) ? users : null;
            } catch {
                return null;
            }
        }

        const users = getUsers();

        if (!users) {
            message.textContent = "Unable to read account storage.";
            return;
        }

        if (users.some(user => user && user.role === "admin")) {
            message.textContent =
                "An administrator already exists in this browser.";
            return;
        }

        message.textContent =
            "Local development mode. Create your administrator account.";
        form.hidden = false;

        form.addEventListener("submit", event => {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email")
                .value.trim().toLowerCase();
            const password = document.getElementById("password").value;

            if (password.length < 12) {
                message.textContent =
                    "Use a password with at least 12 characters.";
                return;
            }

            const latestUsers = getUsers();

            if (!latestUsers) {
                message.textContent = "Account storage could not be read.";
                return;
            }

            if (latestUsers.some(user =>
                user && user.role === "admin"
            )) {
                message.textContent =
                    "An administrator already exists.";
                form.hidden = true;
                return;
            }

            if (latestUsers.some(user =>
                user && user.email &&
                user.email.toLowerCase() === email
            )) {
                message.textContent =
                    "That email is already registered.";
                return;
            }

            const admin = {
                id: "WL-ADMIN-" + Date.now(),
                name,
                firstName: name.split(" ")[0],
                lastName: name.split(" ").slice(1).join(" "),
                email,
                phone: "",
                password,
                role: "admin",
                createdAt: new Date().toISOString()
            };

            latestUsers.push(admin);

            localStorage.setItem(
                "wrenchlinkUsers",
                JSON.stringify(latestUsers)
            );

            localStorage.setItem(
                "wrenchlinkCurrentUser",
                JSON.stringify({
                    id: admin.id,
                    name: admin.name,
                    firstName: admin.firstName,
                    lastName: admin.lastName,
                    email: admin.email,
                    role: "admin"
                })
            );

            message.textContent =
                "Development administrator created. Opening dashboard...";

            form.hidden = true;

            setTimeout(() => {
                location.href = "index.html";
            }, 700);
        });
    })();
    </script>
</body>
</html>
